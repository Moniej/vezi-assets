# Phase 2 baseline: pure price-momentum rotation, monthly, top-3, DB fee schedule.
# SYNTHETIC DATA (confidence 0.0) — plumbing/development only, never evidence.

[experiment]
name = "p2_baseline_momentum"
hypothesis_id = "H-001"
stage = "development"
seed = 20260715                      # SyntheticProvider's internal seed, recorded

[data]
sources = ["synthetic_dev"]
db_path = "data/ngx.sqlite"
min_confidence = 0.0
vintage = ""                         # latest captures
# Pure sector indices + the two composite boards. NGX30 excluded: it is a
# near-market composite and overlaps Premium heavily; Premium/Pension are
# kept but note they overlap the sectors (concentration analysis in Phase 3
# must look through to constituents).
universe = ["NGXBNK", "NGXINS", "NGXOILGAS", "NGXINDUSTR", "NGXCNSMRGDS", "NGXPREMIUM", "NGXPENSION"]
benchmark = "NGXASI"
sim_start = "2016-06-01"
sim_end = "2024-12-31"               # development window ends before holdout

[signal]
lookbacks_months = [3, 6]
lookback_weights = [0.5, 0.5]
method = "rank_average"

[portfolio]
top_n = 3
construction = "equal_weight"
rebalance = "monthly"
execution_lag_days = 1
catalyst_filter = false
impairment_window_months = 12

[costs]
source = "db"                        # effective-dated cost_schedule (assumed retail max)
brokerage_override_pct = -1.0        # <0 = use schedule

[liquidity]
adtv_participation_cap_pct = 10.0    # recorded; ENFORCED from Phase 3
adtv_window_days = 60
enforced = false

[validation]
holdout_start = "2025-01-02"         # development runs REFUSED beyond this
risk_free_annual_pct = 0.0           # placeholder — wrong for NGN, flagged in record
