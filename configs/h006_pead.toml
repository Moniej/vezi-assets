# H-006 — Post-Earnings-Announcement Drift. Executable encoding of
# docs/PREREG_H-006.md (frozen 2026-07-22). Any change after first results
# = new hypothesis ID.
# Encoding note (fixed BEFORE any run): "equal weight across active
# positions, max 20 concurrent" is encoded as FIXED 1/20-of-NAV sizing per
# position; residual NAV sits in the EW-IRU benchmark sleeve.

[experiment]
name = "h006_pead"
hypothesis_id = "H-006"
stage = "development"
seed = 20260722

[data]
sim_start = "2015-07-01"
sim_end = "2024-12-31"
sources = ["ngx_pricelist_v1", "ngx_dol_v1", "ngx_list2_v1"]
min_confidence = 0.9
vintage = "2026-07-21"
requires_coverage_gate = true
iru_version = "v2"
universe = []
benchmark = "EW_IRU"

[signal]
method = "xs_event"
event_calendar = "data/staging/xissuer/earnings_calendar.csv"
hold_sessions = 60                 # base
entry_lag_sessions = 3
select_fraction = 0.3333           # base: top tercile of cohort

[portfolio]
top_n = 20                         # unused by xs_event (rank path only)
max_concurrent = 20
rebalance = "quarterly"            # benchmark sleeve rebalance calendar
execution_lag_days = 1
construction = "equal_weight"

[costs]
source = "db"

[liquidity]
adtv_participation_cap_pct = 10.0
adtv_window_days = 60

[validation]
holdout_start = "2025-01-02"
risk_free_annual_pct = 0.0

[engine]
type = "cross_sectional"
aum_ngn = 1e9

[rng]
algorithm = "PCG64"
seed = 20260722

[failure_conditions]
placebo_alpha = 0.05
max_single_regime_share = 0.8
min_oos_sharpe_retention = 0.25
max_single_sector_share = 1.0

[phase4]
[phase4.stability.grid]
"signal.hold_sessions" = [40, 60]
"signal.select_fraction" = [0.3333, 0.2]

[phase4.placebo]
iterations = 100

[[phase4.regimes]]
name = "pre_float"
stage = "development"
start = "2015-07-01"
end = "2023-05-31"

[[phase4.regimes]]
name = "float_shock"
stage = "development"
start = "2023-06-01"
end = "2024-12-31"

[[phase4.regimes]]
name = "oos_2025_26"
stage = "final_oos"
start = "2025-01-02"
end = "2026-06-30"
