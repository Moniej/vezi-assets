# H-004 pre-registered validation config — executable form of docs/PREREG_H-004.md.
# Registered BEFORE any H-004 experiment ran. Changes after first results = new
# hypothesis ID. Priority rationale: research efficiency (low acquisition cost,
# dataset reuse, fast verdict) — NOT expected success.

[experiment]
name = "p4_validation_h004"
hypothesis_id = "H-004"
stage = "development"
seed = 20260715

[data]
sources = ["investing_com"]
db_path = "data/ngx.sqlite"
min_confidence = 0.4                 # excludes synthetic; BRENT is 0.9, indices 0.5
vintage = ""
universe = ["NGXOILGAS", "NGXASI"]   # two-asset gate: target + neutral
benchmark = "NGXASI"
sim_start = "2016-06-01"
sim_end = "2024-12-31"

[signal]
method = "macro_gate"
macro_series = "BRENT"
target_index = "NGXOILGAS"
neutral_index = "NGXASI"
lookbacks_months = [3]               # BASE configuration: L = 3 (primary test)
lookback_weights = [1.0]

[portfolio]
top_n = 1                            # holds exactly one asset (pre-declared fixed)
construction = "equal_weight"
rebalance = "quarterly"              # BASE configuration
execution_lag_days = 1
catalyst_filter = false
impairment_window_months = 12

[costs]
brokerage_override_pct = -1.0

[engine]
type = "lite"                        # no constituent data — capacity not evaluable (C1)

[rng]
algorithm = "PCG64"
seed = 42
iterations = 100

[failure_conditions]
min_median_capacity_ngn = 0.0        # not evaluable at index level (C1)
max_single_sector_share = 1.0        # DISABLED per prereg: 2-asset gate is
                                     # 100% concentrated by construction
placebo_alpha = 0.05
min_oos_sharpe_retention = 0.25
max_single_regime_share = 0.80       # ACTIVE

[validation]
holdout_start = "2025-01-02"
risk_free_annual_pct = 0.0           # placeholder (C2)

[diagnostics]
run = false                          # staging validation covered index data pre-ingest

[phase4]
[phase4.stability]
lookbacks = [[1], [3], [6], [12]]
top_n = [1]
rebalance = ["monthly", "quarterly"]

[phase4.placebo]
iterations = 100

[[phase4.regimes]]
name = "pre2023"
start = "2016-06-01"
end = "2022-12-30"
stage = "walk_forward"

[[phase4.regimes]]
name = "shock_2023_24"
start = "2023-01-02"
end = "2024-12-31"
stage = "walk_forward"

[[phase4.regimes]]
name = "bull_2025_26"
start = "2025-01-02"
end = "2026-06-30"
stage = "final_oos"
