# Phase 2 turnover/cost sensitivity: rebalance frequency x brokerage rate grid.
# Costs are an EXPERIMENTAL VARIABLE — this sweep is the first economic-viability
# probe, run BEFORE any conclusion about the strategy is allowed.
# SYNTHETIC DATA (confidence 0.0) — plumbing/development only, never evidence.

[experiment]
name = "p2_cost_sensitivity"
hypothesis_id = "H-001"
stage = "development"
seed = 20260715

[data]
sources = ["synthetic_dev"]
db_path = "data/ngx.sqlite"
min_confidence = 0.0
vintage = ""
universe = ["NGXBNK", "NGXINS", "NGXOILGAS", "NGXINDUSTR", "NGXCNSMRGDS", "NGXPREMIUM", "NGXPENSION"]
benchmark = "NGXASI"
sim_start = "2016-06-01"
sim_end = "2024-12-31"

[signal]
lookbacks_months = [3, 6]
lookback_weights = [0.5, 0.5]
method = "rank_average"

[portfolio]
top_n = 3
construction = "equal_weight"
rebalance = "monthly"                # swept below
execution_lag_days = 1
catalyst_filter = false
impairment_window_months = 12

[costs]
source = "db"
brokerage_override_pct = -1.0        # swept below

[liquidity]
adtv_participation_cap_pct = 10.0
adtv_window_days = 60
enforced = false

[validation]
holdout_start = "2025-01-02"
risk_free_annual_pct = 0.0

[sweep]
"portfolio.rebalance" = ["monthly", "quarterly"]
"costs.brokerage_override_pct" = [1.35, 0.75, 0.50]
