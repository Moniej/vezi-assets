# Dataset priority scores — Fund Alpha data moat program.
# OBJECTIVE (revised 2026-07-15): maximize decade-rate of alpha discovery.
# Priority = gen * uniqueness * replication * maintenance * coverage (each 1-5;
# maintenance is INVERTED cost: 5 = cheap to keep alive).
#   gen = GENERATIVITY: how many future hypothesis families this dataset
#   enables/improves. MUST be backed by the named families (see
#   docs/HYPOTHESIS_FAMILY_MAP.md) — unmapped generativity is invalid.
# Scores are revisable judgment. Edit -> rerun scripts/rank_datasets.py.
# necessity = true marks table-stakes data active research needs regardless of moat.

[ngx_daily_pricelist_forward]
name = "NGX per-stock daily price list (volume, value, deals) — forward capture"
gen = 5
families = ["F2", "F3", "F4", "F5", "F6", "F8"]
uniqueness = 4
replication = 5  # time-gated: a competitor starting later can never backfill
maintenance = 4
coverage = 2     # starts at zero today; grows every trading day
necessity = true
mechanism = "M1"
notes = "KEYSTONE (6 families) + time-gated. The single most valuable acquisition."

[pricelist_wayback_backfill]
name = "Historical NGX price lists via web archives (one-off reconstruction)"
gen = 5
families = ["F2", "F3", "F4", "F5", "F8"]
uniqueness = 5
replication = 4
maintenance = 5  # one-off project, zero upkeep
coverage = 2     # probe archive density before committing
mechanism = "M2"
notes = "Keystone's historical half. Probe density; commit if >40% of days recoverable."

