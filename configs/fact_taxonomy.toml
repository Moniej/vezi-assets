# Fact taxonomy for the AI Intelligence Layer's extracted_facts table
# (docs/REASONING_ENGINE_SPECIFICATION.md §4). CONFIGURABLE: adding a leaf
# is a config change, not a code change — same pattern as
# event_taxonomy.toml/document_taxonomy.toml.

[operating_performance]
types = ["earnings", "guidance", "margin_change", "market_share_change",
         "customer_loss", "supplier_issue", "competition_change"]

[corporate_events]
types = ["management_change", "ceo_resignation", "acquisition", "asset_sale",
         "major_contract", "product_launch", "factory_shutdown", "capacity_expansion"]

[capital_and_balance_sheet]
# Stage 3C (2026-08-08): share_reconstruction added -- distinct mechanism
# from bonus_issue (share COUNT is REDUCED via consolidation, e.g. "every
# N shares become 1", the opposite direction of a bonus). NEM, LASACO and
# TRANSCORP's real, sourced corporate actions are this type, not
# bonus_issue -- forcing them into bonus_issue would misrepresent the
# adjustment direction. See docs/STAGE3_EXECUTION_2026-08-08.md Section 4.
types = ["capital_raise", "share_buyback", "dividend", "rights_issue",
         "bonus_issue", "share_reconstruction", "private_placement",
         "debt_change", "cash_change", "capex", "credit_rating_change"]

[legal_and_regulatory]
types = ["litigation", "regulation_change", "government_policy", "tax_change"]

[macro_exposure]
types = ["fx_exposure", "commodity_exposure", "interest_rate_change", "inflation_release"]

[security_and_operational_risk]
types = ["cyber_attack", "operational_disruption"]

[uncategorized]
types = ["other"]   # catch-all; a fact landing here is a taxonomy-triage flag, never dropped

[financial_statements]
# FSI Phase 1 (2026-08-01, docs/fre_runs/fsi_phase1_preregistration.md):
# revenue, net_profit -- the original two-metric pilot scope.
#
# FSI Phase 2 (2026-08-01, docs/fre_runs/fsi_phase2_execution_plan.md +
# the owner's implementation-order instruction): balance sheet (assets,
# liabilities, equity), cash flow (cfo/cfi/cff = operating/investing/
# financing cash flow, capex, fcf), EBITDA/EBIT. `fcf` is always
# confidence_tier='derived' (cfo - capex, per configs/financial_ontology
# .toml's existing definitional edges) -- it is never independently
# extracted from a stated line, by design.
#
# Stage 3B (2026-08-08): cogs, gross_profit -- both already existed as
# financial_ontology.toml income_statement nodes (component_of edges into
# gross_profit) but had no extractable fact_type until now. Unlocks
# Profitability and Gross Profitability (Novy-Marx) IF/once coverage
# clears the platform's own breadth floor -- see
# docs/STAGE3_EXECUTION_2026-08-08.md for the coverage result.
types = ["revenue", "net_profit",
         "assets", "liabilities", "equity",
         "cfo", "cfi", "cff", "capex", "fcf",
         "ebitda", "ebit", "cogs", "gross_profit"]
