# Phase 3: full constituent-level engine — total return, ADTV participation
# caps, line-item cost attribution, capacity distribution, failure conditions.
# Quarterly rebalance (Phase 2's cost table showed monthly is likely unviable).
# SYNTHETIC DATA (confidence 0.0) — plumbing/development only, never evidence.

[experiment]
name = "p3_full_engine"
hypothesis_id = "H-001"
stage = "development"
seed = 20260715

[data]
sources = ["synthetic_dev"]
db_path = "data/ngx.sqlite"
min_confidence = 0.0
vintage = ""
universe = ["NGXBNK", "NGXINS", "NGXOILGAS", "NGXINDUSTR", "NGXCNSMRGDS"]
benchmark = "NGXASI"
sim_start = "2016-06-01"
sim_end = "2024-12-31"

[signal]
lookbacks_months = [3, 6]
lookback_weights = [0.5, 0.5]
method = "rank_average"

[portfolio]
top_n = 2
construction = "equal_weight"
rebalance = "quarterly"
execution_lag_days = 1
catalyst_filter = false
impairment_window_months = 12

[costs]
source = "db"
brokerage_override_pct = -1.0

[liquidity]
adtv_participation_cap_pct = 10.0
adtv_window_days = 60
enforced = true

[engine]
type = "full"
aum_ngn = 2e9                       # swept below
slippage_bps = 30.0                 # ASSUMED half-spread proxy
impact_coeff_bps = 15.0             # ASSUMED sqrt-participation impact coefficient

[rng]
algorithm = "PCG64"
seed = 20260715
iterations = 0                      # deterministic engine; RNG reserved for Phase 4

[failure_conditions]
min_median_capacity_ngn = 1e9       # strategy must absorb >= 1bn NGN at median
max_single_sector_share = 0.80      # no sector may drive >80% of positive return

[validation]
holdout_start = "2025-01-02"
risk_free_annual_pct = 0.0

[diagnostics]
run = true

[sweep]
"engine.aum_ngn" = [5e8, 2e9, 1e10]
