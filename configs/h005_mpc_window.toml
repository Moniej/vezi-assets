# H-005 pre-registered validation config — executable form of docs/PREREG_H-005.md.
# Registered BEFORE any H-005 experiment ran.
# NOTE: for event_window signals, lookbacks_months carries HOLD-DAYS (trading
# days per window) so the existing stability-grid sweeps it; rebalance stays
# "monthly" (= execute at every signal date), top_n stays 1.

[experiment]
name = "p4_validation_h005"
hypothesis_id = "H-005"
stage = "development"
seed = 20260716

[data]
sources = ["investing_com"]
db_path = "data/ngx.sqlite"
min_confidence = 0.4
vintage = ""
universe = ["NGXBNK", "NGXASI"]
benchmark = "NGXASI"
sim_start = "2016-06-01"
sim_end = "2024-12-31"

[signal]
method = "event_window"
event_types = ["mpc_decision"]
target_index = "NGXBNK"
neutral_index = "NGXASI"
lookbacks_months = [10]              # BASE: hold 10 trading days post-announcement
lookback_weights = [1.0]

[portfolio]
top_n = 1
construction = "equal_weight"
rebalance = "monthly"                # passthrough: execute at every signal date
execution_lag_days = 1
catalyst_filter = false
impairment_window_months = 12

[costs]
brokerage_override_pct = -1.0

[engine]
type = "lite"

[rng]
algorithm = "PCG64"
seed = 42
iterations = 100

[failure_conditions]
min_median_capacity_ngn = 0.0
max_single_sector_share = 1.0        # disabled: 2-asset strategy (prereg)
placebo_alpha = 0.05
min_oos_sharpe_retention = 0.25
max_single_regime_share = 0.80

[validation]
holdout_start = "2025-01-02"
risk_free_annual_pct = 0.0

[diagnostics]
run = false

[phase4]
[phase4.stability]
lookbacks = [[5], [10], [21]]
top_n = [1]
rebalance = ["monthly"]

[phase4.placebo]
iterations = 100

[[phase4.regimes]]
name = "pre2023"
start = "2016-06-01"
end = "2022-12-30"
stage = "walk_forward"

[[phase4.regimes]]
name = "shock_2023_24"
start = "2023-01-02"
end = "2024-12-31"
stage = "walk_forward"

[[phase4.regimes]]
name = "bull_2025_26"
start = "2025-01-02"
end = "2026-06-30"
stage = "final_oos"
