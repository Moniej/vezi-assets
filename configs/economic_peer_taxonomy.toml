# FRE-7A: Economic Peer Taxonomy (docs/fre_runs/fre7a_peer_taxonomy_report.md)
#
# Deterministic (sector_ngx, sub_industry) -> (level1, level2, business_model)
# lookup table. Built from NGX's own official Daily Official List sector/
# sub-industry classification (securities.sector_ngx +
# sector_ngx_provenance.sub_industry, FSI Phase 23/26, single snapshot
# retrieval_date=2026-08-02 for all 136 classified tickers) -- the only
# first-party structural reference data this platform holds. No business
# description, revenue mix, or filing-text data exists on this platform to
# refine these buckets further; where NGX's own sub_industry is genuinely
# ambiguous or a catch-all, this is disclosed via `confidence` and `notes`
# rather than guessed away.
#
# GOVERNANCE (FRE-7A hard rule 6): this table was built by reading ONLY the
# 44 real (sector_ngx, sub_industry) pairs actually present in the database
# and general knowledge of what each NGX-published label economically means
# -- NOT by cross-referencing which tickers did or didn't bracket their
# market price in the original FRE-7 pilot. No ticker-specific carve-out
# exists anywhere in this file; every row is a (sector, sub_industry) ->
# taxonomy mapping that applies uniformly to every ticker sharing that pair.
#
# level1 choices used below: Financials, Consumer, Industrials, Energy,
# ICT/Telecom, Healthcare, Real Estate, Utilities, Agriculture,
# Natural Resources, Other -- extended beyond the illustrative 9-category
# list in the FRE-7A brief because the real NGX universe contains
# AGRICULTURE and NATURAL RESOURCES sectors whose economics (commodity
# production/extraction, weather/yield or resource-price risk) are not a
# good fit for "Consumer" or "Industrials".

