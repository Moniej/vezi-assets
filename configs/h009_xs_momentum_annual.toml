# H-009 — Turnover-Budgeted Cross-Sectional Momentum. Executable encoding
# of docs/PREREG_H-009.md (frozen 2026-07-22). Same signal/universe/costs
# as H-007; only rebalance cadence + basket width differ (the specific
# mechanism H-007's own verdict identified as the failure point). Any
# change after first results = new hypothesis ID.

[experiment]
name = "h009_xs_momentum_annual"
hypothesis_id = "H-009"
stage = "development"
seed = 20260722

[data]
sim_start = "2016-01-02"
sim_end = "2024-12-31"
sources = ["ngx_pricelist_v1", "ngx_dol_v1", "ngx_list2_v1"]
min_confidence = 0.9
vintage = "2026-07-21"
requires_coverage_gate = true
iru_version = "v2"
universe = []
benchmark = "EW_IRU"

[signal]
method = "xs_rank"
formation_months = 12               # 12-1, identical to H-007
skip_months = 1
min_obs_formation = 120

[portfolio]
top_n = 25                          # base (H-007 used 20)
rebalance = "annual"                # base (H-007 used quarterly)
execution_lag_days = 1
construction = "equal_weight"

[costs]
source = "db"

[liquidity]
adtv_participation_cap_pct = 10.0
adtv_window_days = 60

[validation]
holdout_start = "2025-01-02"
risk_free_annual_pct = 0.0

[engine]
type = "cross_sectional"
aum_ngn = 1e9

[rng]
algorithm = "PCG64"
seed = 20260722

[failure_conditions]
placebo_alpha = 0.05
max_single_regime_share = 0.8
min_oos_sharpe_retention = 0.25
max_single_sector_share = 1.0

[phase4]
[phase4.stability.grid]
"portfolio.rebalance" = ["semiannual", "annual"]
"portfolio.top_n" = [20, 25, 30]

[phase4.placebo]
iterations = 100

[[phase4.regimes]]
name = "pre_float"
stage = "development"
start = "2016-01-02"
end = "2023-05-31"

[[phase4.regimes]]
name = "float_shock"
stage = "development"
start = "2023-06-01"
end = "2024-12-31"

[[phase4.regimes]]
name = "oos_2025_26"
stage = "final_oos"
start = "2025-01-02"
end = "2026-06-30"
